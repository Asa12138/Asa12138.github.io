<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#2c4254" opacity=".16"/>
    </pattern>
    <radialGradient id="wash">
      <stop stop-color="#3a9b8e" stop-opacity=".32"/>
      <stop offset=".62" stop-color="#3a9b8e" stop-opacity=".14"/>
      <stop offset="1" stop-color="#3a9b8e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="accent">
      <stop stop-color="#d8a35d" stop-opacity=".32"/>
      <stop offset="1" stop-color="#d8a35d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool">
      <stop stop-color="#4e70d6" stop-opacity=".22"/>
      <stop offset="1" stop-color="#4e70d6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <path fill="#f8f6ef" d="M0 0h640v360H0z"/>
  <ellipse cx="250" cy="186" rx="290" ry="184" fill="url(#wash)"/>
  <ellipse cx="472" cy="108" rx="196" ry="126" fill="url(#accent)"/>
  <ellipse cx="496" cy="264" rx="170" ry="110" fill="url(#cool)"/>
  <path fill="url(#grid)" d="M0 0h640v360H0z" opacity=".7"/>

  <g fill="none" stroke="#2c4254" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <!-- Specimen cabinet shadow & frame -->
    <rect x="82" y="54" width="352" height="254" rx="14" fill="#26384b" opacity=".10" stroke="none"/>
    <rect x="74" y="46" width="352" height="254" rx="13" fill="#efe7d8" stroke="#6d5d4b" stroke-width="2.2"/>
    <rect x="86" y="58" width="328" height="230" rx="8" fill="#fbf9f3" stroke="#9b8a74" stroke-width="1.4"/>

    <!-- Six specimen cubbies (3 x 2) -->
    <!-- Row 1 -->
    <rect x="98" y="70" width="94" height="98" rx="6" fill="#edf4f0" stroke="#9cb5ab"/>
    <rect x="203" y="70" width="94" height="98" rx="6" fill="#f5f0e5" stroke="#c3b193"/>
    <rect x="308" y="70" width="94" height="98" rx="6" fill="#eef1fa" stroke="#a6b3d4"/>
    <!-- Row 2 -->
    <rect x="98" y="179" width="94" height="98" rx="6" fill="#f4eef7" stroke="#b9a9c9"/>
    <rect x="203" y="179" width="94" height="98" rx="6" fill="#ebf4f4" stroke="#99b9bc"/>
    <rect x="308" y="179" width="94" height="98" rx="6" fill="#f7f2e6" stroke="#c7b28f"/>

    <!-- Specimen 1: Botanical fern frond -->
    <g transform="translate(145 119)">
      <path d="M0 32V-30" stroke="#3c7a67" stroke-width="2"/>
      <path d="M0 16c-12-4-18-11-22-17 10 0 17 4 22 10m0 7c12-4 18-11 22-17-10 0-17 4-22 10" fill="#7cb8a1" stroke="#3c7a67"/>
      <path d="M0 0c-11-4-16-10-20-16 9 0 15 4 20 10m0 6c11-4 16-10 20-16-9 0-15 4-20 10" fill="#95ccb6" stroke="#3c7a67"/>
      <path d="M0-15c-8-3-12-8-14-12 7 0 11 3 14 7m0 5c8-3 12-8 14-12-7 0-11 3-14 7" fill="#b4dccb" stroke="#3c7a67"/>
    </g>

    <!-- Specimen 2: Nautilus / Ammonite spiral shell -->
    <g transform="translate(250 119)">
      <circle cx="0" cy="0" r="28" fill="#e6c89d" fill-opacity=".55" stroke="#8a6842" stroke-width="1.8"/>
      <path d="M4 2c4-2 6-7 3-11-4-6-13-6-18-1-7 7-6 19 2 25 10 8 25 5 31-6" stroke="#705130" stroke-width="2"/>
      <path d="M0 0l-16-12M0 0l4-22M0 0l22-10M0 0l20 14M0 0l-10 22" stroke="#9e7b51" stroke-width="1.2" opacity=".75"/>
    </g>

    <!-- Specimen 3: Radiolarian / Microbe star -->
    <g transform="translate(355 119)">
      <circle cx="0" cy="0" r="19" fill="#9fb5e8" fill-opacity=".48" stroke="#4764ad" stroke-width="1.8"/>
      <circle cx="0" cy="0" r="9" fill="#d9e3fb" stroke="#4764ad"/>
      <path d="M0-29v10M0 19v10M-29 0h10M19 0h10M-21-21l7 7M14 14l7 7M21-21l-7 7M-14 14l-7 7" stroke="#4764ad" stroke-width="1.6"/>
      <circle cx="-6" cy="-5" r="2" fill="#4764ad" stroke="none"/>
      <circle cx="6" cy="4" r="2" fill="#4764ad" stroke="none"/>
    </g>

    <!-- Specimen 4: Butterfly wing specimen -->
    <g transform="translate(145 228)">
      <path d="M-2-4c-14-20-31-16-28 1 2 10 13 13 26 9" fill="#b49ad1" fill-opacity=".68" stroke="#624d82"/>
      <path d="M2-4c14-20 31-16 28 1-2 10-13 13-26 9" fill="#b49ad1" fill-opacity=".68" stroke="#624d82"/>
      <path d="M-2 5c-15 4-22 16-13 22 8 5 14-4 14-14" fill="#d3c2e8" stroke="#624d82"/>
      <path d="M2 5c15 4 22 16 13 22-8 5-14-4-14-14" fill="#d3c2e8" stroke="#624d82"/>
      <path d="M0-14v32" stroke="#3f3354" stroke-width="2.2"/>
      <path d="M-1-14c-4-7-8-9-11-9M1-14c4-7 8-9 11-9" stroke="#3f3354" stroke-width="1.4"/>
    </g>

    <!-- Specimen 5: Coral / Marine diatom branch -->
    <g transform="translate(250 232)">
      <path d="M0 24V-24M0 10l-18-16M0 6l19-14M-10 1l-12-16M10-2l12-16M0-10l-9-14M0-10l9-14" stroke="#2d7d82" stroke-width="2.6"/>
      <circle cx="-18" cy="-6" r="4" fill="#7bc4c4" stroke="#2d7d82"/>
      <circle cx="19" cy="-8" r="4" fill="#7bc4c4" stroke="#2d7d82"/>
      <circle cx="-22" cy="-15" r="3.5" fill="#a8dede" stroke="#2d7d82"/>
      <circle cx="22" cy="-18" r="3.5" fill="#a8dede" stroke="#2d7d82"/>
      <circle cx="0" cy="-24" r="4.5" fill="#7bc4c4" stroke="#2d7d82"/>
    </g>

    <!-- Specimen 6: Miniature fungi / mushroom trio -->
    <g transform="translate(355 234)">
      <path d="M-18 18v-16M0 18V-8M18 18v-12" stroke="#8b6f52" stroke-width="2.2"/>
      <path d="M-30 2c2-14 22-14 24 0Z" fill="#d99a6c" stroke="#7d5137"/>
      <path d="M-16-8c3-20 29-20 32 0Z" fill="#e5b878" stroke="#7d5137"/>
      <path d="M7 6c2-11 20-11 22 0Z" fill="#c98d6b" stroke="#7d5137"/>
      <circle cx="-5" cy="-16" r="2.2" fill="#fbf9f3" stroke="none"/>
      <circle cx="6" cy="-14" r="1.8" fill="#fbf9f3" stroke="none"/>
      <path d="M-28 19h56" stroke="#9b8a74" stroke-width="1.4"/>
    </g>

    <!-- Small brass label plates under each cubby -->
    <path d="M132 162h26M237 162h26M342 162h26M132 271h26M237 271h26M342 271h26" stroke="#9b8460" stroke-width="2.2"/>

    <!-- Right side: Brass microscope & field tag -->
    <g transform="translate(468 106)">
      <!-- Glass cloche aura -->
      <path d="M12 168V70a46 46 0 0 1 92 0v98Z" fill="#ffffff" fill-opacity=".46" stroke="#9ab4b8" stroke-width="1.5" stroke-dasharray="4 5"/>
      <!-- Microscope -->
      <path d="M22 174h72" stroke="#365063" stroke-width="5"/>
      <path d="M36 172c2-12 10-20 22-20s20 8 22 20" fill="#c9a56b" stroke="#574732" stroke-width="2"/>
      <path d="M76 156c18-16 18-56-6-76" stroke="#574732" stroke-width="4.5"/>
      <path d="M32 128h46" stroke="#365063" stroke-width="3.2"/>
      <g transform="rotate(26 56 84)">
        <rect x="46" y="42" width="18" height="62" rx="4" fill="#d9b97e" stroke="#574732" stroke-width="2"/>
        <rect x="43" y="34" width="24" height="9" rx="2" fill="#365063" stroke="#2c4254"/>
        <rect x="49" y="104" width="12" height="10" rx="2" fill="#365063" stroke="#2c4254"/>
      </g>
      <circle cx="79" cy="112" r="7" fill="#e8cfa0" stroke="#574732" stroke-width="1.8"/>
    </g>

    <!-- Top-right handwritten field note tag -->
    <g transform="translate(460 44) rotate(4 60 22)">
      <rect x="0" y="0" width="126" height="44" rx="6" fill="#fffdf7" stroke="#c8bc9f" stroke-width="1.5"/>
      <circle cx="14" cy="22" r="3.5" fill="#3a9b8e" stroke="none"/>
      <path d="M28 17h78M28 27h56" stroke="#5f7688" stroke-width="2"/>
    </g>

    <!-- Decorative scale marks -->
    <path d="M84 326h92m-92-5v10m23-7v4m23-4v4m23-4v4m23-7v10" stroke="#65818a" opacity=".7"/>
  </g>
</svg>
